{% extends 'base.html' %}

{% block title %}Change Password - SmartRecruit{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-md-6">
        <div class="glass-panel">
            <h2 class="mb-4 fw-bold text-center">Change Password</h2>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary-custom w-100 py-2 mt-3 fw-bold">Change Password</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
