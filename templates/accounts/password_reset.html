{% extends 'base.html' %}
{% load static %}

{% block title %}Reset Password - SmartRecruit{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="col-md-5">
        <div class="glass-panel text-center">
            <h2 class="mb-4 fw-bold">Reset Password</h2>
            <p class="small text-white-50 mb-4">Enter your email address to receive password reset instructions.</p>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary-custom w-100 py-2 mt-3 fw-bold">Send Reset Email</button>
            </form>
            <hr class="border-secondary my-4">
            <p class="mb-0 small"><a href="{% url 'login' %}" class="text-white fw-bold">Back to Login</a></p>
        </div>
    </div>
</div>
{% endblock %}
